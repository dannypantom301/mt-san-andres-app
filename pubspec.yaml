publish_to: 'none'

version: 1.3.4+9

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0
  archive: ^3.6.1
  xml: ^6.5.0
  flutter_map: ^6.2.1
